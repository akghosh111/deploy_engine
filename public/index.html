<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deploy Engine | Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&family=Syne:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --container-bg: #121212;
            --text-primary: #eaeaea;
            --text-secondary: #888;
            --accent: #fff;
            --border-color: rgba(255, 255, 255, 0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Manrope', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            text-transform: lowercase;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 300;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
            color: var(--text-primary);
            font-family: 'Manrope', sans-serif;
            font-size: 1rem;
            transition: var(--transition);
        }

        input:focus {
            border-bottom-color: var(--accent);
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 16px;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            margin-top: 8px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.5;
        }

        #result {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            display: none;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; height: 0; transform: translateY(10px); }
            to { opacity: 1; height: auto; transform: translateY(0); }
        }

        #result h2 {
            font-family: 'Syne', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .result-item {
            margin-bottom: 12px;
        }

        .result-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: block;
        }

        .result-value {
            font-size: 0.95rem;
            color: var(--text-primary);
            word-break: break-all;
        }

        .loading-text {
            display: none;
        }

        button.loading .btn-text {
            display: none;
        }

        button.loading .loading-text {
            display: inline;
        }

        #containerList {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        #containerList h2 {
            font-family: 'Syne', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .container-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        .container-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .card-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .card-domain {
            font-size: 0.75rem;
            color: var(--accent);
            text-decoration: none;
            opacity: 0.7;
            transition: var(--transition);
        }

        .card-domain:hover {
            opacity: 1;
        }

        .card-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .card-status.running {
            background-color: #4ade80;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
        }

        .card-status.exited {
            background-color: #f87171;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            margin-left: 12px;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 10px;
            font-size: 0.65rem;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            border-radius: 2px;
            transition: var(--transition);
        }

        .action-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .action-btn.stop:hover {
            border-color: #facc15;
            color: #facc15;
        }

        .action-btn.delete:hover {
            border-color: #f87171;
            color: #f87171;
        }

        .empty-state {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
            padding: 20px 0;
            font-style: italic;
        }

        /* Allow container to grow if needed */
        body {
            overflow-y: auto;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>deploy.</h1>
        <p class="subtitle">instantiate your environment</p>

        <form id="deployForm">
            <div class="form-group">
                <label for="image">Image</label>
                <input type="text" id="image" placeholder="e.g. nginx" required>
            </div>
            <div class="form-group">
                <label for="tag">Tag</label>
                <input type="text" id="tag" placeholder="e.g. latest" required>
            </div>
            <button type="submit" id="submitBtn">
                <span class="btn-text">deploy container</span>
                <span class="loading-text">deploying...</span>
            </button>
        </form>

        <div id="result">
            <h2>Deployment Success</h2>
            <div class="result-item">
                <span class="result-label">Container Name</span>
                <span class="result-value" id="resContainerName"></span>
            </div>
            <div class="result-item">
                <span class="result-label">Domain</span>
                <span class="result-value" id="resDomain"></span>
            </div>
        </div>

        <div id="containerList">
            <h2>Active Environments</h2>
            <div id="listItems">
                <!-- Containers will be injected here -->
                <p class="empty-state">No active containers found.</p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('deployForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultArea = document.getElementById('result');
        const resContainerName = document.getElementById('resContainerName');
        const resDomain = document.getElementById('resDomain');
        const listItems = document.getElementById('listItems');

        const fetchContainers = async () => {
            try {
                const response = await fetch('/containers');
                const result = await response.json();
                
                if (result.status === 'success') {
                    renderContainers(result.data);
                }
            } catch (err) {
                console.error('Failed to fetch containers:', err);
            }
        };

        const renderContainers = (containers) => {
            if (containers.length === 0) {
                listItems.innerHTML = '<p class="empty-state">No active containers found.</p>';
                return;
            }

            listItems.innerHTML = containers.map(container => `
                <div class="container-card" data-id="${container.id}">
                    <div class="card-info">
                        <span class="card-name">${container.name}</span>
                        <span class="card-meta">${container.image} • ${container.status}</span>
                        ${container.state === 'running' 
                            ? `<a href="http://${container.domain}" target="_blank" class="card-domain">${container.domain}</a>`
                            : `<span class="card-meta">Offline</span>`
                        }
                    </div>
                    <div class="card-actions">
                        ${container.state === 'running' 
                            ? `<button class="action-btn stop" onclick="stopContainer('${container.id}')">Stop</button>` 
                            : ''
                        }
                        <button class="action-btn delete" onclick="deleteContainer('${container.id}')">Delete</button>
                        <div class="card-status ${container.state}"></div>
                    </div>
                </div>
            `).join('');
        };

        const stopContainer = async (id) => {
            if (!confirm('Are you sure you want to stop this container?')) return;
            
            try {
                const response = await fetch(`/container/${id}/stop`, { method: 'POST' });
                const result = await response.json();
                if (result.status === 'success') {
                    fetchContainers();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('Failed to stop container');
            }
        };

        const deleteContainer = async (id) => {
            if (!confirm('Are you sure you want to delete this container? This action is permanent.')) return;

            try {
                const response = await fetch(`/container/${id}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.status === 'success') {
                    fetchContainers();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('Failed to delete container');
            }
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const image = document.getElementById('image').value;
            const tag = document.getElementById('tag').value;

            // Reset UI
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            resultArea.style.display = 'none';

            try {
                const response = await fetch('/container', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ image, tag })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    resContainerName.textContent = result.data.containerName;
                    resDomain.textContent = result.data.domain;
                    resultArea.style.display = 'block';
                    fetchContainers(); // Refresh list
                } else {
                    alert('Deployment failed: ' + (result.message || 'Unknown error'));
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred during deployment.');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

        // Initial fetch
        fetchContainers();
        // Poll every 10 seconds
        setInterval(fetchContainers, 10000);
    </script>
</body>
</html>
